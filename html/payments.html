<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Table</title>
    <link rel="stylesheet" href="../css/payment.css"> <!-- Add your CSS file path here -->
   
</head>
<body>
    <h1>Payments Management</h1>
    <form id="payments-filter">
        <label for="start-date">Start Date:</label>
        <input type="date" id="startDate" name="startDate" required>
        <label for="end-date">End Date:</label>
        <input type="date" id="endDate" name="endDate" required>
    </form>
    <button id="reset-filters">Reset</button>
    <!-- Table to Display Payments -->
    <table id="payments-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Reservation</th>
                <th>Amount</th>
                <th>Payment Date</th>
                <th>Method</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Rows will be dynamically inserted here -->
        </tbody>
    </table>

    <!-- Form to Add New Payment -->
 

    <script>
        const API_PAYMENTS = '/admin/payments';
        const API_RESERVATIONS = '/reservations';
        const API_PAYMENTS_WITHIN_PERIOD = "/admin/paymentsWithinPeriod";
        const API_TOTAL_PAYMENTS_AMOUNT = "/admin/totalPaymentsAmount"

        const startDateInput = document.querySelector("#startDate");
        const endDateInput = document.querySelector("#endDate");
        // Fetch and display payments
        async function fetchPayments() {
            try {
                let res;
                const startDate = startDateInput.value;
                const endDate = endDateInput.value;
                    res = await fetch(API_PAYMENTS, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ startDate, endDate }),
                    });

                const payments = await res.json();
                console.log(payments)
                const tableBody = document.querySelector('#payments-table tbody');
                tableBody.innerHTML = ''; // Clear existing rows

                payments.forEach(payment => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${payment.payment_id}</td>
                        <td>${payment.reservation_id}</td>
                        <td>$${parseInt(payment.amount).toFixed(2)}</td>
                        <td>${new Date(payment.payment_date).toLocaleString()}</td>
                        <td>${payment.payment_method}</td>
                        <td>
                            <button onclick="deletePayment(${payment.payment_id})">Delete</button>
                        </td>
                    `;

                    tableBody.appendChild(row);
                });

                total_amount_res = await fetch(API_TOTAL_PAYMENTS_AMOUNT, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ startDate, endDate }),
                    });

                const total_amount = await total_amount_res.json();
                const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>Total</td>
                        <td colspan="5" style="text-align: center;">${total_amount[0].total_amount}</td>
                    `;
                    tableBody.appendChild(row);
            } catch (error) {
                console.error(error);
                alert('Could not load payments.');
            }
        }

        // Fetch and populate reservation options
        async function fetchReservations() {
            try {
                const res = await fetch(API_RESERVATIONS);
                if (!res.ok) {
                    throw new Error('Failed to fetch reservations.');
                }
                const reservations = await res.json();
                const reservationSelect = document.querySelector('#reservation_id');
                reservationSelect.innerHTML = '<option value="" disabled selected>Select Reservation</option>'; // Reset options

                reservations.forEach(reservation => {
                    const option = document.createElement('option');
                    option.value = reservation.reservation_id;
                    option.textContent = `ID: ${reservation.reservation_id}, Pickup: ${new Date(reservation.pickup_date).toLocaleDateString()}`;
                    reservationSelect.appendChild(option);
                });
            } catch (error) {
                console.error(error);
                alert('Could not load reservations.');
            }
        }

        // Delete a payment
        async function deletePayment(paymentId) {
            if (!confirm('Are you sure you want to delete this payment?')) {
                return;
            }

            try {
                const res = await fetch(`${API_PAYMENTS}/${paymentId}`, {
                    method: 'DELETE',
                });

                if (!res.ok) {
                    throw new Error('Failed to delete payment.');
                }

                alert('Payment deleted successfully!');
                fetchPayments(); // Reload payments table
            } catch (error) {
                console.error(error);
                alert('Could not delete payment.');
            }
        }

        // Load payments and reservations on page load
        fetchPayments();
        fetchReservations();

        startDateInput.addEventListener("change", fetchPayments);
        endDateInput.addEventListener("change", fetchPayments);

        const resetFiltersButton = document.querySelector("#reset-filters");
        resetFiltersButton.addEventListener("click", () => {
            startDateInput.value = "";
            endDateInput.value = "";
            fetchPayments();
        });
    </script>
</body>
