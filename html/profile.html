<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <link rel="stylesheet" href="../css/profile.css">
    <!-- <link rel="stylesheet" href="../css/Home_Page.css"> -->
    <script src="../js/profile.js" defer></script>
</head>
 <body>
    <header class="header">
        <nav class="navbar">
            <a href="./Home_Page.html">Home</a>
            <a href="#">Profile</a>
            <a href="#">Portfolio</a>
            <a href="./About_Page.html">About</a>
            <a href="#">Contact</a>
            <a href="#">Help</a>
        </nav>
       </header>

       
     <div class="profile_Page">

        <section class="profile" id="profile">
            <div class="customer-container">
                <div class="user-container">
                    <img src="../Photos/account.png" alt="profile picture" width="180em" height="180em">
                    <h2 id="customer-name">loading...</h2>
                </div>
                <div class="user-info-container">
                    <h3>Your Information</h3>
                    <p><strong>Email:</strong> <span id="customer-email"></span></p>
                    <p><strong>Phone:</strong> <span id="customer-phone"></span></p>
                    <p><strong>Address:</strong> <span id="customer-address"></address></p>
                </div>
            </div>

            <div class="cars-container">

            </div>
        </section>
    </div>

    <div id="rent-modal" class="modal" style="display: none;">
            <div class="modal-content">
                <span id="close-btn" class="close-btn">&times;</span>
                <h2>Rent a Car</h2>
                <form id="rent-form">
                    <input type="hidden" id="car-id" name="car_id">
                    <label for="start-date">Start Date:</label>
                    <input type="date" id="startDate" name="startDate" required>
                    <label for="end-date">End Date:</label>
                    <input type="date" id="endDate" name="endDate" required>
                    <p id="price-display" style="color: green;">Total Price: $0</p>
                    <button type="submit" class="btn-2">Confirm Rental</button>
                </form>
            </div>
        </div>
 </body>
</html>
